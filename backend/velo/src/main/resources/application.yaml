server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        same-site: strict
        http-only: true

spring:
  config:
    import:
      - "optional:file:./datasource.local[.yaml]"
      - "optional:file:./velo/datasource.local[.yaml]"
      - "optional:file:./backend/velo/datasource.local[.yaml]"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
